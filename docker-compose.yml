services:
  invoicer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicer
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - PORT=3000
    volumes:
      # Persist the SQLite database outside the container
      - invoicer_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  invoicer_data:
    driver: local
